<!DOCTYPE html>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f0f0; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0; }
        .stat { background: #667eea; color: white; padding: 20px; border-radius: 5px; text-align: center; }
        .stat h3 { margin: 0; font-size: 14px; }
        .stat .value { font-size: 32px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #667eea; color: white; }
        .charts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin: 20px 0; }
        .chart { background: #f8f9fa; padding: 20px; border-radius: 5px; }
        .filter-bar { margin: 20px 0; padding: 15px; background: #f0f0f0; border-radius: 5px; }
        .filter-bar select, .filter-bar input { padding: 8px; margin-right: 10px; border-radius: 5px; border: 1px solid #ddd; }
    </style>
</head>

            <label style="margin-left: 20px;">Filter by Application:</label>

            <button onclick="resetFilters()" style="margin-left: 20px; padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer;">Reset Filters</button>

        <div class="charts">

        let currentPage = 1;
        const itemsPerPage = 50;
        let filteredData = data;
        
        function updateStats(filteredData) {
            document.getElementById('total').textContent = filteredData.length;
            document.getElementById('high').textContent = filteredData.filter(i => i.Priority.includes('P1') || i.Priority.includes('P2')).length;
            document.getElementById('old').textContent = filteredData.filter(i => i.Age >= 60).length;
            const avgAge = filteredData.length > 0 ? filteredData.reduce((a,b) => a + b.Age, 0) / filteredData.length : 0;
            document.getElementById('avg').textContent = Math.round(avgAge);
        }
        
        function renderTable(issues) {
            const tbody = document.getElementById('table');
            tbody.innerHTML = '';
            
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = issues.slice(startIndex, endIndex);
            
            pageData.forEach(i => {
                tbody.innerHTML += '<tr><td><a href="https://jira.dell.com/browse/'+i.Key+'">'+i.Key+'</a></td><td>'+i.Summary+'</td><td>'+i.Priority+'</td><td>'+i.Status+'</td><td>'+i.Application+'</td><td>'+i.Age+'</td></tr>';
            });
            
            const totalPages = Math.ceil(issues.length / itemsPerPage);
            document.getElementById('pageInfo').textContent = 'Page ' + currentPage + ' of ' + totalPages;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
        }
        
        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderTable(filteredData);
            }
        }
        
        function nextPage() {
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderTable(filteredData);
            }
        }
        
        function applyFilters() {
            const priorityFilter = document.getElementById('priorityFilter').value;
            const applicationFilter = document.getElementById('applicationFilter').value;
            
            filteredData = data;
            
            if (priorityFilter && priorityFilter !== 'all') {
                filteredData = filteredData.filter(i => i.Priority === priorityFilter);
            }
            
            if (applicationFilter && applicationFilter !== 'all') {
                filteredData = filteredData.filter(i => i.Application === applicationFilter);
            }
            
            currentPage = 1;
            renderTable(filteredData);
            updateStats(filteredData);
        }
        
        function resetFilters() {
            document.getElementById('priorityFilter').value = 'all';
            document.getElementById('applicationFilter').value = 'all';
            filteredData = data;
            currentPage = 1;
            renderTable(filteredData);
            updateStats(filteredData);
        }
        
        updateStats(data);
        
        const priorities = [...new Set(data.map(i => i.Priority))];
        const priorityFilter = document.getElementById('priorityFilter');
        priorities.forEach(priority => {
            const option = document.createElement('option');
            option.value = priority;
            option.textContent = priority;
            priorityFilter.appendChild(option);
        });
        
        const applications = [...new Set(data.map(i => i.Application))].sort();
        const applicationFilter = document.getElementById('applicationFilter');
        applications.forEach(app => {
            const option = document.createElement('option');
            option.value = app;
            option.textContent = app;
            applicationFilter.appendChild(option);
        });
        
        renderTable(data);
        
        const priorityCounts = {};
        data.forEach(i => priorityCounts[i.Priority] = (priorityCounts[i.Priority] || 0) + 1);
        new Chart(document.getElementById('priorityChart'), {
            type: 'pie',
            data: { labels: Object.keys(priorityCounts), datasets: [{ data: Object.values(priorityCounts), backgroundColor: ['#ff6b6b','#ffa500','#ffd93d','#6bcb77','#4d96ff'] }] }
        });
        
        const statusCounts = {};
        data.forEach(i => statusCounts[i.Status] = (statusCounts[i.Status] || 0) + 1);
        new Chart(document.getElementById('statusChart'), {
            type: 'bar',
            data: { labels: Object.keys(statusCounts), datasets: [{ label: 'Issues', data: Object.values(statusCounts), backgroundColor: '#667eea' }] }
        });
        
        const applicationCounts = {};
        data.forEach(i => applicationCounts[i.Application] = (applicationCounts[i.Application] || 0) + 1);
        new Chart(document.getElementById('applicationChart'), {
            type: 'bar',
            data: {
                labels: Object.keys(applicationCounts),
                datasets: [{
                    label: 'Issues',
                    data: Object.values(applicationCounts),
                    backgroundColor: '#4d96ff'
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    title: { display: true, text: 'Issues by Application' }
                }
            }
        });
    </script>
